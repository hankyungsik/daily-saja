name: 오늘의 사자성어

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦게 시작되기도 하므로 새벽부터 세 번 깨워 둔다.
    # 먼저 시작된 실행이 06:58 KST까지 기다렸다 보내고, 나머지는 이미 보냈으면 건너뛴다.
    # 한국시간 월~금 02:10 / 04:10 / 06:10 = UTC 일~목 17:10 / 19:10 / 21:10
    - cron: "10 17 * * 0-4"
    - cron: "10 19 * * 0-4"
    - cron: "10 21 * * 0-4"
  workflow_dispatch:
    inputs:
      record:
        description: "발송 기록 남기기 (끄면 테스트 발송)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-saja
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 메일 발송
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python send.py --scheduled
          elif [ "${{ inputs.record }}" = "false" ]; then
            python send.py --no-record
          else
            python send.py
          fi

      - name: 발송 기록 저장
        run: |
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          git commit -m "발송 기록: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase
          git push
